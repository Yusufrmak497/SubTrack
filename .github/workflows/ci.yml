name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  backend-tests:
    name: Backend Tests (pytest + coverage)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: tinyvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: tinyvault-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tinyvault-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/tinyvault_test
          JWT_SECRET_KEY: ci-test-secret
          ADMIN_PASSWORD: admin123
          DEMO_USER_PASSWORD: user123
          DEMO_VIEWER_PASSWORD: viewer123
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: tinyvault-api/coverage.xml

  frontend-unit-tests:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: v2/tinyvault-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2/tinyvault-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: v2/tinyvault-frontend/coverage

  playwright-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit-tests]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: tinyvault_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tinyvault-api/requirements.txt

      - name: Install backend dependencies
        working-directory: tinyvault-api
        run: pip install -r requirements.txt

      - name: Start backend
        working-directory: tinyvault-api
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/tinyvault_e2e
          JWT_SECRET_KEY: ci-test-secret
          ADMIN_PASSWORD: admin123
          DEMO_USER_PASSWORD: user123
          DEMO_VIEWER_PASSWORD: viewer123
          ADMIN_TEST_TOTP_SECRET: JBSWY3DPEHPK3PXP
          ENVIRONMENT: test
        run: uvicorn main:app --port 8000 &

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            curl -s http://localhost:8000/ && break
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v2/tinyvault-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: v2/tinyvault-frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: v2/tinyvault-frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: v2/tinyvault-frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: v2/tinyvault-frontend/playwright-report